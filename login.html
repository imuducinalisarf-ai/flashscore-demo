<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autentificare – FlashScore România</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<nav class="navbar"></nav>

<div class="page-wrapper no-ticker" style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 60px)">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-icon">⚽</div>
      <div class="auth-logo-text">Flash<span>Score</span></div>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Bun venit înapoi!</h1>
      <p class="auth-subtitle">Autentifică-te pentru a accesa funcționalitățile complete.</p>

      <form class="auth-form" id="login-form" novalidate>
        <div id="login-error" class="form-error" style="display:none;padding:10px 14px;background:var(--red-dim);border:1px solid var(--red);border-radius:var(--radius)"></div>

        <div class="form-group">
          <label for="login-email">Adresă email</label>
          <div class="input-with-icon">
            <span class="input-icon">✉️</span>
            <input type="email" id="login-email" placeholder="email@exemplu.ro" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Parolă</label>
          <div class="input-with-icon">
            <span class="input-icon">🔒</span>
            <input type="password" id="login-password" placeholder="Parola ta" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" onclick="togglePassword('login-password')" aria-label="Afișează parola">👁</button>
          </div>
        </div>

        <div class="auth-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me"> Ține-mă minte
          </label>
          <a href="#" class="forgot-link">Ai uitat parola?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="padding:12px">Autentificare</button>
      </form>

      <div class="auth-divider" style="margin:20px 0">SAU</div>

      <button class="btn-google" onclick="demoLogin()">
        <span class="g-icon">🎮</span> Login Demo (fără cont)
      </button>

      <p class="auth-footer-text">
        Nu ai cont? <a href="register.html">Înregistrează-te gratuit</a>
      </p>
    </div>

    <!-- Demo credentials info -->
    <div style="margin-top:16px;background:rgba(0,194,255,0.08);border:1px solid rgba(0,194,255,0.2);border-radius:var(--radius);padding:14px;font-size:12px;color:var(--text-muted)">
      <div style="font-weight:700;color:var(--accent);margin-bottom:6px">💡 Date de test Admin:</div>
      <div>📧 Email: <code style="color:var(--text)">admin@flashscore.ro</code></div>
      <div>🔒 Parolă: <code style="color:var(--text)">admin123</code></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  // Redirect if already logged in
  document.addEventListener('DOMContentLoaded', () => {
    if (isLoggedIn()) window.location.href = 'index.html';
  });

  function demoLogin() {
    const demoUser = { name: 'Demo User', email: 'demo@flashscore.ro', role: 'user', joined: '2026-04-17' };
    localStorage.setItem('fs_user', JSON.stringify(demoUser));
    showToast('Logat ca Demo User ✓', 'success');
    setTimeout(() => window.location.href = 'index.html', 800);
  }
</script>
</body>
</html>
