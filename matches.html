<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meciuri – FlashScore România</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/matches.css">
</head>
<body>

<nav class="navbar"></nav>

<div class="ticker-bar">
  <div class="ticker-label">🔴 LIVE</div>
  <div class="ticker-content"></div>
</div>

<div class="page-wrapper">
  <div class="container" style="padding-top:24px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px">
      <h1 style="font-size:22px;font-weight:800">📅 Meciuri</h1>
      <div style="font-size:13px;color:var(--text-muted)" id="today-date"></div>
    </div>

    <!-- Filters + Search -->
    <div class="filter-row" style="justify-content:space-between">
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="status-filters">
        <button class="filter-btn active" data-filter="all">Toate</button>
        <button class="filter-btn" data-filter="live">🔴 Live</button>
        <button class="filter-btn" data-filter="ht">⏸ Pauză</button>
        <button class="filter-btn" data-filter="ft">✅ Finalizate</button>
        <button class="filter-btn" data-filter="upcoming">🕐 Programate</button>
      </div>
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="team-search" placeholder="Caută echipă...">
      </div>
    </div>

    <!-- League filter pills -->
    <div class="filter-row" style="gap:6px;margin-top:0" id="league-filter-pills">
      <button class="filter-btn active" data-league="all">Toate ligile</button>
    </div>
  </div>

  <div class="layout-main">
    <div>
      <div id="matches-container"></div>
    </div>
    <div id="betting-slip-mount"></div>
  </div>
</div>

<footer>
  <div class="footer-bottom" style="max-width:1280px;margin:0 auto;padding:20px">
    <span>© 2026 FlashScore România</span>
    <span><a href="index.html" style="color:var(--accent)">← Înapoi la homepage</a></span>
  </div>
</footer>

<div id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/matches.js"></script>
<script src="js/betting.js"></script>
<script>
  let activeStatusFilter = 'all';
  let activeLeagueFilter = 'all';
  let searchTerm = '';

  document.addEventListener('DOMContentLoaded', () => {
    // Date
    document.getElementById('today-date').textContent = new Date().toLocaleDateString('ro-RO', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    // Betting slip
    document.getElementById('betting-slip-mount').innerHTML = buildBettingSlip();
    renderBetSlip();

    // Build league pills
    const pillsContainer = document.getElementById('league-filter-pills');
    LEAGUES.forEach(l => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.dataset.league = l.id;
      btn.innerHTML = `${l.flag} ${l.name}`;
      pillsContainer.appendChild(btn);
    });

    // League filter
    document.querySelectorAll('#league-filter-pills .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#league-filter-pills .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeLeagueFilter = btn.dataset.league;
        applyFilters();
      });
    });

    // Status filter
    document.querySelectorAll('#status-filters .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#status-filters .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeStatusFilter = btn.dataset.filter;
        applyFilters();
      });
    });

    // Search
    document.getElementById('team-search').addEventListener('input', (e) => {
      searchTerm = e.target.value.trim();
      applyFilters();
    });

    applyFilters();
    simulateLiveUpdates();
  });

  function applyFilters() {
    let filtered = [...liveMatches];

    // League filter
    if (activeLeagueFilter !== 'all') filtered = filtered.filter(m => m.leagueId === activeLeagueFilter);

    // Status filter
    if (activeStatusFilter === 'live')     filtered = filtered.filter(m => m.status === 'LIVE');
    if (activeStatusFilter === 'ht')       filtered = filtered.filter(m => m.status === 'HT');
    if (activeStatusFilter === 'ft')       filtered = filtered.filter(m => m.status === 'FT');
    if (activeStatusFilter === 'upcoming') filtered = filtered.filter(m => m.status === 'NS');

    // Search
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      filtered = filtered.filter(m => {
        const teams = TEAMS[m.leagueId] || [];
        const h = teams.find(t => t.id === m.homeTeam);
        const a = teams.find(t => t.id === m.awayTeam);
        return h?.name.toLowerCase().includes(q) || a?.name.toLowerCase().includes(q);
      });
    }

    const container = document.getElementById('matches-container');
    if (!filtered.length) {
      container.innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--text-muted)">
        <div style="font-size:48px;margin-bottom:16px">⚽</div>
        <p style="font-size:16px;font-weight:600;margin-bottom:8px">Niciun meci găsit</p>
        <p style="font-size:13px">Încearcă un alt filtru sau termen de căutare.</p>
      </div>`;
      return;
    }

    // Group by league
    const grouped = {};
    filtered.forEach(m => {
      if (!grouped[m.leagueId]) grouped[m.leagueId] = [];
      grouped[m.leagueId].push(m);
    });

    container.innerHTML = Object.entries(grouped).map(([lgId, matches]) => {
      const league = getLeague(lgId);
      const liveCount = matches.filter(m => m.status === 'LIVE').length;
      return `
        <div class="league-section" id="section-${lgId}" style="margin-bottom:12px">
          <div class="league-header" onclick="toggleLeagueSection('${lgId}')">
            <span class="league-flag">${league?.flag || '🏆'}</span>
            <span class="league-name-text">${league?.name || lgId}</span>
            ${liveCount ? `<span class="badge badge-live" style="font-size:10px">${liveCount} LIVE</span>` : ''}
            <span class="league-match-count">${matches.length} meciuri</span>
            <span class="league-toggle-icon">▾</span>
          </div>
          <div class="league-matches matches-wrapper">
            ${matches.map(m => renderMatchCard(m)).join('')}
          </div>
        </div>`;
    }).join('');
  }
</script>
</body>
</html>
